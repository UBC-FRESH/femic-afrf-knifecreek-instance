# FVS-BC selection regimes for the Knife Creek mule-deer winter range.
#
# Default policy basis: GWM_2007, Amended Order U-5-001/2/3, Shallow and
# Moderate Snowpack (2007), Schedule 1 GWM 10. The order requires clumps of
# 4-10 or more mature trees with interlocking crowns, legal BA >37.5 cm
# targets, Table 2 D values, and a large-tree reserve.
#
# AFRF MWP #3 Table 29 is a named alternative under `afrf_table29_regimes`.
# It is not the legal curve: it uses D 60/55/50 and no legal large-tree
# targets. Do not mix the two bases in one state graph.
#
# Default cut method: split_large_small. THINABA removes surplus large trees
# in the 37.5-D cm range to the legal minimum large-tree BA; trees above D
# remain as the reserve. THINQFA then thins the 0-37.5 cm component to B minus
# the retained large-tree BA. Harvesting surplus above D requires a tree-level
# reserve rule that FVS does not provide; the pilot tests the D-protected cut.
# A full-range THINABA to 999 is a sensitivity, not the default.
#
# THINQFA implements the BDq target. The BC variant converts fields 2
# (minimum DBH), 3 (maximum DBH) and 6 (class width) from centimetres to
# inches in canada/bc/initre.f, so those fields are written in centimetres.
# THINABA field 2 is m2/ha; its DBH fields are cm. The THINQFA residual
# density is square feet per acre; the supplemental record selects that unit.

default_basis: GWM_2007
legal_basis: true

gwm_2007_regimes:
  - id: SEL_GWM_HIGH
    label: GWM 2007 High, split large/small cut
    status: reviewed-legal-policy
    basis: GWM_2007
    legal: true
    habitat_class: High
    residual_basal_area_m2_ha: 29.0
    large_tree_ba_min_m2_ha: 16.0
    large_tree_dbh_cm: 37.5
    large_tree_reserve_m2_ha: [0.0, 2.9]
    max_dbh_cm: 70.0
    q_factor: 1.25
    q_range: [1.20, 1.35]
    cutting_cycle_years: 30
    method: split_large_small
    harvest_surplus_large_trees: true
    species_preference: null
    keywords:
      - THINABA
      - THINQFA
    fvsbc_keywords:
      - name: THINABA
        fields:
          year_or_cycle: 2
          target_ba_m2_ha: 16.0
          cutting_efficiency: 1.0
          min_dbh_cm: 37.5
          max_dbh_cm: 70.0
          min_height_m: 0.0
          max_height_m: 999.0
      - name: THINQFA
        fields:
          year_or_cycle: 2
          min_dbh_cm: 0.0
          max_dbh_cm: 37.5
          species_code: 0
          q_factor: 1.25
          class_width_cm: 5.0
          residual_density: 56.63
        supplemental_record:
          units: 0
          units_label: basal_area_ft2_per_acre
    entry_settings:
      TIMEINT: ",30"
      NUMCYCLE: 2
      note: Cycle 2 with a 30-year period applies the cut at year 30.
    notes: >-
      Legal High: B 29, BA >37.5 >=16, D >=70, q 1.20-1.35, reserve 0-2.9.
      Surplus large trees above 16 m2/ha are harvested. If the stand has less
      than 16 m2/ha above 37.5 cm, THINABA cancels and the residual large-tree
      target is reported as unmet.

  - id: SEL_GWM_MODERATE
    label: GWM 2007 Moderate, split large/small cut
    status: reviewed-legal-policy
    basis: GWM_2007
    legal: true
    habitat_class: Moderate
    residual_basal_area_m2_ha: 22.0
    large_tree_ba_min_m2_ha: 11.0
    large_tree_dbh_cm: 37.5
    large_tree_reserve_m2_ha: [0.0, 2.2]
    max_dbh_cm: 60.0
    q_factor: 1.25
    q_range: [1.25, 1.35]
    cutting_cycle_years: 30
    method: split_large_small
    harvest_surplus_large_trees: true
    species_preference: null
    keywords:
      - THINABA
      - THINQFA
    fvsbc_keywords:
      - name: THINABA
        fields:
          year_or_cycle: 2
          target_ba_m2_ha: 11.0
          cutting_efficiency: 1.0
          min_dbh_cm: 37.5
          max_dbh_cm: 60.0
          min_height_m: 0.0
          max_height_m: 999.0
      - name: THINQFA
        fields:
          year_or_cycle: 2
          min_dbh_cm: 0.0
          max_dbh_cm: 37.5
          species_code: 0
          q_factor: 1.25
          class_width_cm: 5.0
          residual_density: 47.92
        supplemental_record:
          units: 0
          units_label: basal_area_ft2_per_acre
    entry_settings:
      TIMEINT: ",30"
      NUMCYCLE: 2
      note: Cycle 2 with a 30-year period applies the cut at year 30.
    notes: >-
      Legal Moderate: B 22, BA >37.5 >=11, D >=60, q 1.25-1.35, reserve 0-2.2.

  - id: SEL_GWM_LOW
    label: GWM 2007 Low, split large/small cut
    status: reviewed-legal-policy
    basis: GWM_2007
    legal: true
    habitat_class: Low
    residual_basal_area_m2_ha: 16.0
    large_tree_ba_min_m2_ha: 6.0
    large_tree_dbh_cm: 37.5
    large_tree_reserve_m2_ha: [0.0, 1.6]
    max_dbh_cm: 50.0
    q_factor: 1.30
    q_range: [1.25, 1.40]
    cutting_cycle_years: 30
    method: split_large_small
    harvest_surplus_large_trees: true
    species_preference: null
    keywords:
