wrapper_gaps:
  - id: thinqfa_supplemental_record
    description: >-
      Resolved in fresh-fvsbc P42.1: Keyword.supplemental writes THINQFA's
      one-line residual-density-units record. The KC pin is d86e78b.
    status: resolved
    target_repository: UBC-FRESH/fresh-fvsbc
    resolved_by: d86e78b0fc31386684aae1a0a1a9a821c0ee2baf
  - id: entry_year_semantics
    description: >-
      Resolved by a synthetic pilot: cycle 2 with TIMEINT=,30 applies at year
      30; cycle 4 with TIMEINT=,10 also applies at year 30.
    status: resolved
    evidence: notes/reference/fvsbc-thinqfa-pilot.md
  - id: spatial_clumps_and_hmz
    description: >-
      FVS-BC is distance-independent. The 4-10-tree interlocking-crown clumps,
      canopy openings, and the U-5-002 HMZ matrix are ws4/post-processing or
      spatial constraints, not FVS keywords.
    status: open
    owner: ws4 instance

benchmark:
  default_basis: GWM_2007
  legal_targets: data/benchmarks/mdwr_gwm2007_targets.csv
  clump_targets: data/benchmarks/mdwr_gwm2007_clump.csv
  hmz: data/benchmarks/mdwr_gwm2007_knife_creek_hmz.csv
  afrf_table29: data/benchmarks/mwp3_figure11_target_stand_structure.csv
  acceptance:
    - post-harvest total BA at or above the legal B minimum for the class
    - post-harvest BA in stems >=37.5 cm at or above 16/11/6 m2/ha
    - post-harvest maximum DBH at or above the legal Table 2 D (70/60/50) or a documented reserve
    - post-harvest q within 1.20-1.35 / 1.25-1.35 / 1.25-1.40
    - surplus large trees above the minimum are removed by THINABA, not by lowering the large-tree target
    - clump post-processing uses 4-10 mature trees; the maximum-diameter subgroup is 2-5
    - the HMZ area matrix is checked spatially; a stand-level run alone is not compliance
