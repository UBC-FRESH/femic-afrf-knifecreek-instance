# FVS-BC selection regimes for the Knife Creek mule-deer winter range.
#
# Policy source: config/mdwr_regimes.yaml, interpreted from AFRF MWP #3
# Table 29. These are reviewed policy targets. They are not yet runnable: the
# state-transition pilot and the THINQFA entry-year semantics are still
# outstanding. The wrapper can now write THINQFA's supplemental record (P42.1,
# commit d86e78b); the record is not the remaining blocker.
#
# THINQFA implements the BDq target: it thins an uneven-aged stand through a
# diameter range to a q-factor distribution and a residual density. The BC
# variant converts fields 2 (minimum DBH), 3 (maximum DBH) and 6 (class width)
# from centimetres to inches in canada/bc/initre.f, so those fields are written
# in centimetres here. The residual-density target is square feet per acre.
# The supplemental record selects that unit.

regimes:
  - id: SEL_MDWR_HIGH
    label: Single-tree selection, MDWR High
    status: reviewed-policy-pending-pilot
    habitat_class: High
    residual_basal_area_m2_ha: 29.0
    max_dbh_cm: 60.0
    q_factor: 1.25
    cutting_cycle_years: 30
    species_preference: null
    keywords:
      - THINQFA
    fvsbc_keyword:
      name: THINQFA
      fields:
        year_or_cycle: 2
        min_dbh_cm: 0.0
        max_dbh_cm: 60.0
        species_code: 0
        q_factor: 1.25
        class_width_cm: 5.0
        residual_density: 126.32
      supplemental_record:
        units: 0
        units_label: basal_area_ft2_per_acre
      entry_settings:
        TIMEINT: ",30"
        NUMCYCLE: 2
        note: >-
          Cycle 2 with a 30-year period applies the cut at year 30, after the
          first 30-year growth interval. Cycle 1 would apply at year 0.
      notes: >-
        Full-range BDq target. Cycle 2 with TIMEINT=,30 and NUMCYCLE=2 is the
        reviewed 30-year entry.
    notes: >-
      Table 29 High: B 29 m2/ha, D 60 cm, q 1.25, 30-year cycle. The policy
      direction is single-tree selection with groups of 2-5 trees at the
      maximum diameter. FVS-BC is distance-independent and cannot enforce the
      spatial grouping.

  - id: SEL_MDWR_MODERATE
    label: Single-tree selection, MDWR Moderate
    status: reviewed-policy-pending-pilot
    habitat_class: Moderate
    residual_basal_area_m2_ha: 22.0
    max_dbh_cm: 55.0
    q_factor: 1.25
    cutting_cycle_years: 30
    species_preference: null
    keywords:
      - THINQFA
    fvsbc_keyword:
      name: THINQFA
      fields:
        year_or_cycle: 2
        min_dbh_cm: 0.0
        max_dbh_cm: 55.0
        species_code: 0
        q_factor: 1.25
        class_width_cm: 5.0
        residual_density: 95.83
      supplemental_record:
        units: 0
        units_label: basal_area_ft2_per_acre
      entry_settings:
        TIMEINT: ",30"
        NUMCYCLE: 2
        note: Cycle 2 applies the cut at year 30.
      notes: >-
        Full-range BDq target. Cycle 2 with a 30-year period is the reviewed
        entry.
    notes: >-
      Table 29 Moderate: B 22 m2/ha, D 55 cm, q 1.25, 30-year cycle.

  - id: SEL_MDWR_LOW
    label: Single-tree selection, MDWR Low
    status: reviewed-policy-pending-pilot
    habitat_class: Low
    residual_basal_area_m2_ha: 16.0
    max_dbh_cm: 50.0
    q_factor: 1.30
    cutting_cycle_years: 30
    species_preference: null
    keywords:
      - THINQFA
    fvsbc_keyword:
      name: THINQFA
      fields:
        year_or_cycle: 2
        min_dbh_cm: 0.0
        max_dbh_cm: 50.0
        species_code: 0
        q_factor: 1.30
        class_width_cm: 5.0
        residual_density: 69.70
      supplemental_record:
        units: 0
        units_label: basal_area_ft2_per_acre
      entry_settings:
        TIMEINT: ",30"
        NUMCYCLE: 2
        note: Cycle 2 applies the cut at year 30.
      notes: >-
        Full-range BDq target. Cycle 2 with a 30-year period is the reviewed
        entry.
    notes: >-
      Table 29 Low: B 16 m2/ha, D 50 cm, q 1.30, 30-year cycle.

design_variants:
  - id: SEL_MDWR_SMALL_TREE
    label: Small-tree thinning below 37.5 cm DBH
    status: design-only
    description: >-
      The plan says harvest opportunities concentrate on trees below 37.5 cm
      DBH and that the maximum-diameter class is retained in groups of 2-5
      trees. A full-range THINQFA removes some trees above 37.5 cm to reach
      the BDq target. This variant instead thins only the 0-37.5 cm component.
    fvsbc_keyword:
      name: THINQFA
      fields:
        year_or_cycle: 2
        min_dbh_cm: 0.0
        max_dbh_cm: 37.5
        species_code: 0
        q_factor: 1.25
        class_width_cm: 5.0
        residual_density: computed-per-state
      supplemental_record:
        units: 0
        units_label: basal_area_ft2_per_acre
    residual_density_rule: >-
      Table 29 residual B minus the basal area retained above 37.5 cm DBH in
      the current state, floored at zero. The pilot must compute this per state,
      not use a fixed number.
    notes: >-
      This is closer to the operational wording but it does not guarantee the
      full-stand q target. Compare it with the full-range regime in the pilot
      and report which one better matches Figure 11 and Table 29.

wrapper_gaps:
  - id: thinqfa_supplemental_record
    description: >-
      Resolved in fresh-fvsbc P42.1: Keyword.supplemental and
      SUPPLEMENTAL_KEYWORDS write THINQFA's one-line residual-density-units
      record without an END terminator. The KC pin is d86e78b.
    status: resolved
    target_repository: UBC-FRESH/fresh-fvsbc
    resolved_by: d86e78b0fc31386684aae1a0a1a9a821c0ee2baf
  - id: entry_year_semantics
    description: >-
      Resolved by a synthetic pilot: cycle 1 applies at year 0; with
      TIMEINT=,30 and NUMCYCLE=2, THINQFA at cycle 2 applies at year 30; with
      TIMEINT=,10 and NUMCYCLE=4, cycle 4 also applies at year 30.
    status: resolved
    evidence: notes/reference/fvsbc-thinqfa-pilot.md
  - id: spatial_grouping
    description: >-
      The 2-5 tree maximum-diameter groups are a spatial constraint. FVS-BC
      cannot model it. Enforce or report it in ws4/post-processing.
    status: open

benchmark:
  figure11_table: data/benchmarks/mwp3_figure11_target_stand_structure.csv
  figure11_metadata: data/benchmarks/mwp3_figure11_target_stand_structure.metadata.json
  figure11_review: data/benchmarks/mwp3_figure11_review.jsonl
  thinqfa_pilot: notes/reference/fvsbc-thinqfa-pilot.md
  acceptance:
    - compare residual basal area by habitat class with Table 29 (29/22/16 m2/ha)
    - compare maximum DBH with Table 29 (60/55/50 cm)
    - compare the residual 5 cm diameter distribution with Figure 11
    - report the recovered Figure 11 sums (17.02/22.96/30.17 m2/ha) and implied q (1.306/1.254/1.253) as shape checks, not targets
    - compare thinning yield with the plan's ~50 m3/ha expectation
    - compare treated area with the 82.0 ha/year selection AAC
