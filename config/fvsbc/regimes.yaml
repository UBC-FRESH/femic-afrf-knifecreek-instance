          target_ba_m2_ha: 6.0
          cutting_efficiency: 1.0
          min_dbh_cm: 37.5
          max_dbh_cm: 50.0
          min_height_m: 0.0
          max_height_m: 999.0
      - name: THINQFA
        fields:
          year_or_cycle: 2
          min_dbh_cm: 0.0
          max_dbh_cm: 37.5
          species_code: 0
          q_factor: 1.30
          class_width_cm: 5.0
          residual_density: 43.56
        supplemental_record:
          units: 0
          units_label: basal_area_ft2_per_acre
    entry_settings:
      TIMEINT: ",30"
      NUMCYCLE: 2
      note: Cycle 2 with a 30-year period applies the cut at year 30.
    notes: >-
