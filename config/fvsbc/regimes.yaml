    label: GWM 2007 High, retain all above D
    status: sensitivity-not-default
    basis: GWM_2007
    legal: true
    habitat_class: High
    residual_basal_area_m2_ha: 29.0
    max_dbh_cm: 70.0
    q_factor: 1.25
    cutting_cycle_years: 30
    method: full_range_bdq
    harvest_surplus_large_trees: false
    fvsbc_keyword:
      name: THINQFA
      fields:
        year_or_cycle: 2
        min_dbh_cm: 0.0
        max_dbh_cm: 70.0
        species_code: 0
        q_factor: 1.25
        class_width_cm: 5.0
        residual_density: 126.32
      supplemental_record:
        units: 0
        units_label: basal_area_ft2_per_acre
    notes: >-
      Contrast case: retain every tree above the legal D. It does not harvest
      surplus large trees and may leave residual BA above B. Use only as a
      sensitivity, not the default.

