# Pinned toolchain for the Knife Creek instance.
#
# A version range is not a pin. Record the repository and the exact commit for
# every engine whose output becomes evidence.

toolchain:
  fresh_fvsbc:
    repository: https://github.com/UBC-FRESH/fresh-fvsbc
    commit: d86e78b0fc31386684aae1a0a1a9a821c0ee2baf
    version: 0.12.0
    version_note: >-
      Post-v0.12.0 main. The v0.12.0 tag predates the P42.1 THINQFA
      supplemental-record support; this commit includes it.
    role: individual-tree growth and selection-cut engine
    docs: https://ubc-fresh.github.io/fresh-fvsbc/
  nemora:
    repository: https://github.com/UBC-FRESH/nemora
    commit: 2e8776c0ffce15cb4b18e2fbd70bdd4c1c4467d9
    version: 0.0.1-alpha
    role: DBH PDF fitting and inverse-CDF synthetic stem-population generation
    note: >-
      Pinned for the P1.3a IDF Cariboo PSP stem-list analog. The fit and
      inverse-CDF sampling use the grouped Weibull fit and sample_distribution
      from this commit.
  ws4:
    repository: https://github.com/UBC-FRESH/ws4
    commit: TBD
    role: estate model, optimization, and reporting
  femic:
    repository: https://github.com/UBC-FRESH/femic
    commit: TBD
    role: boundary, inventory, BEC, and data-prep pipeline
