  document: Alex Fraser Research Forest Management and Working Plan #3
  date: 2007-01-01
  pdf: reference/AFRF-management-working-plan-3-2007.pdf
  sha256: 9bfd8b8f0449f45fb97fcf529236640ace09b73ba74f77001f677eee7307ff6a
  legal_order:
    document: Amended Order U-5-001, U-5-002 and U-5-003, Shallow and Moderate Snowpack
    date: 2007-02
    local: /srv/shared-data/gep/ws4/sources/afrf-mule-deer/gwm_order_shallow_moderate_2007.pdf
  part1a:
