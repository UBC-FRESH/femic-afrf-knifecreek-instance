  table29_page_printed: 89
  table34_page_pdf: 108
  table32_page_pdf: 107
  table35_page_pdf: 109
  table36_page_pdf: 114
  appendix9_page_pdf: 162
  appendix9_page_printed: 150

working_circle:
  name: Knife Creek Mule Deer Winter Range
  gross_area_table26_ha: 3333
  reserves_table26_ha: 152
  net_productive_area_table32_ha: 3117
  appendix9_gross_area_ha: 3485.6
  appendix9_net_area_ha: 3162.3
  sup_legal_boundary_area_ha: 3533.1341
  primary_objective: mule-deer winter habitat
  silvicultural_system: single-tree selection
  retention_pattern: >-
    clumpy single-tree selection. GWM 10 requires clumps of 4-10 or more
    mature trees with interlocking crowns. Within those clumps, the maximum
    diameter class is distributed in groups of 2-5 trees.
  cutting_cycle_years: 30
  harvest_constraints:
    - no conventional clearcut
    - no even-aged silviculture
    - single-tree selection with clumpy residual structure
    - clumps of 4-10 or more mature trees with interlocking crowns
    - maximum-diameter class grouped in 2-5 trees within the clump
    - canopy openings 0.3-1.0 mature tree heights, mean 0.5
    - retain at least 80% of pre-harvest merchantable Douglas-fir basal area before 2026
    - concentrate removals on trees below 37.5 cm DBH
    - typical thinning yield about 50 m3/ha
  aac:
    single_tree_selection_ha_per_year: 82.0
    salvage_ha_per_year: 11.2
    total_ha_per_year: 93.2
    period: 2001-2005 comparison in Table 35
    actual_2001_2005:
      partial_cut_ha_per_year: 44.3
      salvage_ha_per_year: 31.2
      total_ha_per_year: 76.1
  cclup:
    conventional_harvest_pct: 45
    modified_harvest_pct: 50
    no_harvest_pct: 5
  plan_outcome:
    conventional_harvest_pct: 0
    modified_harvest_pct: 95
    no_harvest_pct: 5
  note: >-
    The area figures differ by vintage and boundary. Table 32 net productive
    area is 3,117 ha; Appendix 9 net area is 3,162.3 ha; the legal SUP is
    3,533.1341 ha. Record the differences; do not force agreement.

legal_gwm_2007:
  # Amended Order U-5-001/2/3, Shallow and Moderate Snowpack, Schedule 1
  # GWM 10, Tables 1 and 2. Knife Creek is U-5-002 dwl_50, IDFdk3/IDFdw.
  basis: legal
  note: >-
    These are the legal stand-level minima. Table 29 below is the AFRF
    interpretation and uses lower D for High and Moderate; do not present
    Table 29 as legal compliance.
  classes:
    - id: HIGH
      total_ba_min_m2_ha: 29.0
      large_tree_ba_min_m2_ha: 16.0
      large_tree_dbh_cm: 37.5
      max_dbh_min_cm: 70.0
      q_range: [1.20, 1.35]
      large_tree_reserve_m2_ha: [0.0, 2.9]
    - id: MODERATE
      total_ba_min_m2_ha: 22.0
      large_tree_ba_min_m2_ha: 11.0
      large_tree_dbh_cm: 37.5
      max_dbh_min_cm: 60.0
      q_range: [1.25, 1.35]
      large_tree_reserve_m2_ha: [0.0, 2.2]
    - id: LOW
      total_ba_min_m2_ha: 16.0
      large_tree_ba_min_m2_ha: 6.0
      large_tree_dbh_cm: 37.5
      max_dbh_min_cm: 50.0
      q_range: [1.25, 1.40]
      large_tree_reserve_m2_ha: [0.0, 1.6]
  clump:
    min_mature_trees: 4
    max_mature_trees: 10
    max_dbh_group_size: [2, 5]
    interlocking_crowns: true
  canopy_openings:
    diameter_tree_heights: [0.3, 0.5, 1.0]
    average_tree_heights: 0.5
  transition:
    pre_2026_ba_retention_min: 0.80
  knife_creek_hmz:
    uwr: U-5-002
    unit: dwl_50
    # L = Low only; M = Low or Moderate; A = all classes.
    zones:
      1: M
      2: L
      3: M
      4: M
      5: A
    note: >-
      Legal order Table 3, p. 7. HMZ is spatial; a stand-level BDq run alone
      cannot establish compliance. The order also has a north-facing >20%
      slope, >10 ha exemption in the Moderate Snowpack zone; it requires the
      spatial order/GIS test.

habitat_class_basis:
  id: AFRF_MWP3_TABLE29
  legal: false
  note: >-
    The habitat_classes block is the AFRF Table 29 interpretation. The legal
    2007 GWM extraction is in legal_gwm_2007.

habitat_classes:
  # AFRF MWP #3 Table 29 interpretation. This is NOT the legal GWM curve:
  # D is 60/55/50 here versus the order Table 2 values 70/60/50, and there is
  # no large-tree reserve. Use legal_gwm_2007 above for a legal-basis run.
  - id: HIGH
    label: High
    residual_basal_area_m2_ha: 29.0
    max_dbh_cm: 60.0
    q_factor: 1.25
    q_class_width_cm: 5.0
    cutting_cycle_years: 30
    fvsbc_thinqfa:
      # The BC variant converts fields 2, 3 and 6 from cm to inches in
      # canada/bc/initre.f. Pass centimetres here, not inches.
      min_dbh_cm: 0.0
      max_dbh_cm: 60.0
      q_factor: 1.25
      class_width_cm: 5.0
      residual_density: 126.32
      residual_density_units: basal_area_ft2_per_acre
      supplemental_units: 0
  - id: MODERATE
    label: Moderate
    residual_basal_area_m2_ha: 22.0
    max_dbh_cm: 55.0
    q_factor: 1.25
    q_class_width_cm: 5.0
    cutting_cycle_years: 30
    fvsbc_thinqfa:
      min_dbh_cm: 0.0
      max_dbh_cm: 55.0
      q_factor: 1.25
      class_width_cm: 5.0
      residual_density: 95.83
      residual_density_units: basal_area_ft2_per_acre
      supplemental_units: 0
  - id: LOW
    label: Low
    residual_basal_area_m2_ha: 16.0
    max_dbh_cm: 50.0
    q_factor: 1.30
    q_class_width_cm: 5.0
    cutting_cycle_years: 30
    fvsbc_thinqfa:
      min_dbh_cm: 0.0
      max_dbh_cm: 50.0
      q_factor: 1.30
      class_width_cm: 5.0
      residual_density: 69.70
      residual_density_units: basal_area_ft2_per_acre
      supplemental_units: 0

unit_conversions:
  basal_area_m2_ha_to_ft2_ac: 4.356
  cm_to_in: 0.3937007874
  five_cm_class_in: 1.97
  note: >-
    The residual-density target is in square feet per acre. The minimum DBH,
    maximum DBH and class width are centimetres in the keyword file because
    canada/bc/initre.f converts those three fields to inches.

