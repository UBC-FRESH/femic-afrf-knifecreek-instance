# Knife Creek mule-deer winter-range management contract.
#
# Source: Alex Fraser Research Forest Management and Working Plan #3
# (January 1, 2007), Tables 29, 32 and 35, Appendix 9; the Amended Order
# #U-5-001/2/3 Shallow and Moderate Snowpack (2007); Part 1a (LMH 60);
# Extension Note 25A; and the 2003 Knife Creek transition plan.
#
# Table 29 is the AFRF residual-structure interpretation. It is not the legal
# stand-level GWM curve: the legal order requires D >= 70/60/50 cm and BA in
# stems >=37.5 cm >= 16/11/6 m2/ha for High/Moderate/Low. Both bases are
# represented here. See notes/reference/mdwr-canopy-clump-requirements.md.

