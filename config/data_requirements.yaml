# Data requirements for the Knife Creek model.
#
# Status values: required, optional, acquired, reviewed, blocked.
# A source is not acquired until its checksum and provenance are recorded.

sources:
  - id: boundary
    description: Knife Creek legal boundary and block identifier.
    status: acquired
    public_release: "yes (Open Government Licence - British Columbia)"
    path: data/boundaries/knife_creek_sup_S15382.gpkg
    sha256: e79189b10d5da590d0adae658fc59607ca63e242362c9ee8963c76bea731f480
    notes: >-
      Provincial Special Use Permit S15382, "Research or Educational",
      ACTIVE, 3,533.1341 ha. WFS type
      pub:WHSE_FOREST_TENURE.FTEN_SPEC_USE_PERMIT_POLY_SVW. See
      metadata/boundary_source.yaml. FADM_TSA confirms Williams Lake TSA 29.

  - id: vri
    description: VRI 2025 forest vegetation composite rank 1 layer.
    status: acquired
    public_release: "yes (Open Government Licence - British Columbia)"
    path: data/inventory/vri_2025_kc.gpkg
    sha256: 9d05220b18c073902c47755088adfa532fe288e312b4d0418e7bb67a073837b5
    notes: >-
      183 clipped polygons over 3,533.13 ha; 174 of 183 carry SITE_INDEX.
      Leading species FDI 160, AT 7, SX 5, PLI 2. WFS type
      pub:WHSE_FOREST_VEGETATION.VEG_COMP_LYR_R1_POLY. See
      metadata/layer_sources.yaml.

  - id: bec
    description: BEC map, zone/subzone/variant.
    status: acquired
    public_release: "yes (Open Government Licence - British Columbia)"
    path: data/inventory/bec_kc.gpkg
    sha256: 12f3bf192dd326a6fcf8a12a4d615da7decbca8e158afafaa9abad56d29dc145
    notes: >-
      IDFdk3 3,051.80 ha and IDFxm 481.33 ha inside the SUP. The map does not
      show an SBPSmk polygon inside the boundary. WFS type
      pub:WHSE_FOREST_VEGETATION.BEC_BIOGEOCLIMATIC_POLY.

  - id: site_index
    description: Site index by species.
    status: acquired
    public_release: "yes (VRI-derived; Open Government Licence - British Columbia)"
    path: data/inventory/vri_2025_kc.gpkg
    notes: >-
      SITE_INDEX is present on 174 of 183 VRI polygons; EST_SITE_INDEX and
      EST_SITE_INDEX_SPECIES_CD are also carried. The Provincial Site
      Productivity Layer is an alternative, but the catalogue marks it Access
      Only and its direct resource is a raster folder.

  - id: disturbance
    description: Fire perimeters and harvest history.
    status: acquired
    public_release: "mixed; fire is OGL-BC, cutblock polygons are Access Only"
    path: data/inventory/fire_perimeters_kc.gpkg
    sha256: 4fc1f232ee3958ce91ab489c5cc5502537b4603698413e6227e6f625d76b2cd5
    secondary_path: data/inventory/harvest_history_kc.csv
    secondary_sha256: 798618cdf443672bcac7800017f50481fc92ed9886dfa4a9b396ab99a2de8a14
    notes: >-
      Three fire perimeters intersect the block: 2013 6.04 ha, 1938 62.11 ha,
      1937 0.66 ha. Harvest history is a derived table of 60 openings over
      2,478.73 ha, 1956-2023. The raw cutblock polygons are not committed
      because the catalogue records them as Access Only.

  - id: mule_deer
    description: Mule-deer stand structure habitat classes.
    status: acquired
    public_release: "yes (Open Government Licence - British Columbia)"
    path: data/habitat/mule_deer_stand_structure_kc.gpkg
    sha256: 5a2165eff5df62021b0da0db70f512443edb592f548da1cfe1975813e11dc535
    notes: >-
      83 clipped polygons. High 1,327.68 ha, Moderate 1,135.66 ha, Low
      1,020.53 ha, Nil 6.15 ha. This is the public habitat-class layer, not the
      legal UWR order.

  - id: mule_deer_legal_order
    description: Approved Ungulate Winter Range boundary and legal mule-deer objectives.
    status: blocked
    public_release: TBD
    notes: >-
      The approved UWR layer and the Cariboo long-term objective maps are
      catalogue Access Only / Government. The public stand structure habitat
      classes are acquired, and MWP #3 gives the public management direction
      (single-tree selection, BDq, 30-year cycle, 95% modified harvest), but the
      legal constraint must come from AFRF or the province before a scenario can
      claim compliance.

  - id: mwp3_management_plan
    description: AFRF Management and Working Plan #3, including the Knife Creek MDWR direction.
    status: acquired
    public_release: "public UBC AFRF planning document; UBC copyright, not OGL"
    path: reference/AFRF-management-working-plan-3-2007.pdf
    sha256: 9bfd8b8f0449f45fb97fcf529236640ace09b73ba74f77001f677eee7307ff6a
    notes: >-
      January 1, 2007. Table 29 gives the MDWR target structures (High
      29 m2/ha, D 60 cm, q 1.25; Moderate 22/55/1.25; Low 16/50/1.30; 30-year
      cycle). Table 35 gives the KC AAC (82.0 ha/yr selection, 11.2 ha/yr
      salvage). The plan is public management direction, not the legal UWR
      order. Extracted contract: config/mdwr_regimes.yaml.

  - id: mwp3_transition_strategy_2003
    description: CCLUP Mule Deer Strategy Committee (2003), Transition period harvest opportunities, Knife Creek.
    status: blocked
    public_release: TBD
    notes: >-
      Cited by MWP #3 as the Knife Creek-specific transition strategy. Not
      acquired. The public plan gives the long-term Table 29 structure but not
      the transition-period order.

  - id: mwp3_figure11_targets
    description: Recovered Figure 11 target stand structure by MDWR habitat class.
    status: reviewed
    public_release: "derived from a public UBC AFRF planning document"
    path: data/benchmarks/mwp3_figure11_target_stand_structure.csv
    metadata_path: data/benchmarks/mwp3_figure11_target_stand_structure.metadata.json
    review_path: data/benchmarks/mwp3_figure11_review.jsonl
    notes: >-
      figrecover 0.1.0a1 recovery of MWP #3 Figure 11 (PDF page 97). Recovered
      basal-area sums 17.02/22.96/30.17 m2/ha for Low/Moderate/High versus
      Table 29 targets 16/22/29. Use Table 29 for the target and Figure 11 for
      the shape. See notes/reference/mwp3-figure11-recovery.md.

  - id: mwp3_kc_compartments
    description: Knife Creek compartment and planned harvest-unit area table.
    status: acquired
    public_release: "public UBC AFRF planning document"
    path: data/benchmarks/mwp3_kc_compartments.csv
    metadata_path: data/benchmarks/mwp3_kc_compartments.metadata.json
    notes: >-
      Appendix 9, PDF page 162 (printed 150). Gross 3,485.6 ha, net 3,162.3 ha,
      with 48.3 ha non-productive, 125.5 ha ESA, 64.4 ha reserve, and 84.1 ha
      permanent OGMA. The source map is schematic and has no coordinate grid;
      this is a table transcription, not a GIS layer.

  - id: site_index_table
    description: Klinka 2004 site-index estimates by site series and species.
    status: acquired
    public_release: "public UBC AFRF report; UBC copyright, not OGL"
    path: data/site_index/klinka_2004_site_index.csv
    metadata_path: data/site_index/klinka_2004_site_index.metadata.json
    notes: >-
      Tables 8.2.1-8.2.4, PDF pages 62-63 (printed 53-54). 105 rows covering
      IDFxm, IDFdk3, SBSdw1 and ICHmk3. Site index in metres at 50 years breast
      height, with the report's 5-class scale and limited/non-viable flags.
      Direct table transcription, not figure recovery.

  - id: site_series_classification
    description: AFRF site-series classification and identification tools.
    status: acquired
    public_release: "public report; UBC AFRF copyright, not OGL"
    path: reference/AFRF-site-unit-report-2004.pdf
    sha256: 94459a7bc6002932bc9a2150deb6d81879fbd48d776b86e4666e75addc7f5705
    catalog_path: config/site_series.yaml
    notes: >-
      Klinka et al. 2004, Site Units of the UBC Alex Fraser Research Forest.
      IDFxm 01-09 and IDFdk3 01-10 site series, nine site groups, keys,
      edatopic grids, descriptions, and appendices. The report is a UBC AFRF
      publication, not MIT-licensed.

  - id: site_series_map
    description: Georeferenced AFRF site-series polygon map.
    status: blocked
    public_release: TBD
    notes: >-
      The Klinka report's site maps are folded map pockets and a CD-ROM; the
      PDF contains the classification and tools but not the GIS polygons. The
      spatial map is still required for a site-series assignment. Do not infer
      site series from BEC alone.

  - id: cfi_plots
    description: Continuous forest inventory or research plot tallies.
    status: optional
    public_release: TBD
    notes: >-
      Preferred stem-list basis. An AFRF data dump has been requested from
      Ionut Aron (AFRF data manager). If measured tallies are released, use
      them and record the plot design. Otherwise reconstruct from VRI and
      nemora and label the result synthetic.

  - id: forest_cover_attributes
    description: Height, diameter, density, and species attributes beyond VRI.
    status: acquired
    public_release: "yes (VRI-derived; Open Government Licence - British Columbia)"
    path: data/inventory/vri_2025_kc.gpkg
    notes: >-
      VRI carries species composition, projected age, height, volume, basal
      area, stems per hectare, crown closure, and site index.
