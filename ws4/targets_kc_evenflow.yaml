# KC even-flow harvest-volume scenario: 20 x 10-year periods.
# Structural only. No growing-stock/level targets yet. WS4 clamps yield curves
# to their endpoint values before the first point and after the last point, so
# the 200-year run is defined by the curve contract. The source curves still
# need a longer FVS horizon for a real 200-year rebuild; do not post-extend them.
#
# The 27,000 m3/period floor is a tested structural floor. The even-flow band
# is the shape constraint and still needs a longer search to converge.

targets:
- account: product.yield.managed.total
  period: 1
  period_width: 10
  flow: even
  minimum: -5
  maximum: 5
  min_weight: 10000
  max_weight: 10000
  shape: non_linear
  flow_reference_period: 1
  priority: 2
- account: product.yield.managed.total
  period: 1
  period_width: 10
  minimum: 27000
  min_weight: 0.1
  shape: linear
  priority: 2
