# Knife Creek layer provenance

All layers are clipped to the SUP S15382 legal boundary
(`data/boundaries/knife_creek_sup_S15382.gpkg`, EPSG:3005). The fetch AOI was
the expanded boundary bbox `1278155,785051,1291760,794881` in EPSG:3005.

