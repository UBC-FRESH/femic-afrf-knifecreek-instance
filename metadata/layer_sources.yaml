## Harvest history (derived)

| Field | Value |
| --- | --- |
| Dataset | Harvested Areas of BC (Consolidated Cutblocks) |
| WFS type | `pub:WHSE_FOREST_VEGETATION.VEG_CONSOLIDATED_CUT_BLOCKS_SP` |
| Catalogue | https://catalogue.data.gov.bc.ca/dataset/harvested-areas-of-bc-consolidated-cutblocks- |
| Licence | Catalogue `Access Only`; public WFS access |
| Fetched features | 188 |
| Clipped features | 60 |
| Harvested area | 2,478.73 ha |
| Harvest years | 1956-2023 |
| Committed file | `data/inventory/harvest_history_kc.csv` |
| SHA-256 | `798618cdf443672bcac7800017f50481fc92ed9886dfa4a9b396ab99a2de8a14` |

The raw cutblock polygons are **not** committed because the catalogue records
the layer as `Access Only`. The derived table keeps the opening ID, harvest
dates, clearcut/partial percentages, source area, and clipped area. The raw
fetch is reproducible from the WFS type above.

Major harvest years include 1965 (319.23 ha), 1966 (618.91 ha), 1970
(171.70 ha), 1980 (162.09 ha), and 2009 (133.83 ha). The block has a long
history of partial and clearcut harvesting; the VRI and cutblock layer should
be reconciled before assigning origin.

